  return `<div class="stack">
    <div class="card"><div class="row" style="align-items:flex-end"><div class="grow"><div class="small muted">Launch score · ${h(b.title)} v${S.current.version}</div><div class="row"><span class="score">${R.total}</span><span class="pill ${R.pill}" style="font-size:14px">${R.pill[0].toUpperCase() + R.pill.slice(1)}</span></div></div>
      <div class="small"><div>Logic <b>${R.logic}</b>/40</div><div>AI <b>${R.ai.score}</b>/25</div><div>Live <b>${R.live.score}</b>/35 <span class="muted">(solve ${R.live.parts.solve}, fun ${R.live.parts.fun}, time ${R.live.parts.time})</span></div></div></div>
      <p class="small muted">Draft under 60 · Testing 60–84 · Ready at 85+ with every gate passing.</p></div>
    <div class="card"><h2>Launch gate</h2>${R.gate.map(g => `<div class="gate">${sev(g.pass ? 'ok' : 'critical').replace(g.pass ? '>ok<' : '>critical<', g.pass ? '>pass<' : '>not yet<')}<div><div>${h(g.label)}</div>${g.detail ? `<div class="small muted">${h(g.detail)}</div>` : ''}</div></div>`).join('')}</div>
    <div class="card stack"><div class="row"><h2 class="grow">Puzzle heatmap</h2>${levelPicker(lvl, 'reportLevel')}</div>
      <div class="tablewrap"><table class="list heat small"><thead><tr><th>Puzzle</th><th>Status</th><th>Tests</th><th>Median</th><th>Target</th><th>Hinted</th><th>Gave up</th><th>Top tags</th></tr></thead><tbody>
      ${stats.map(s => `<tr><td><span class="mono">${h(s.id)}</span> ${h(s.name || '')}</td><td class="status-${s.status}">${s.status === 'none' ? '<span class="muted">no data</span>' : `<b>${s.status}</b>`}</td><td>${s.n}</td><td>${s.n ? fmtTime(Math.round(s.medianSeconds)) : '–'}</td><td>${fmtTime(s.targetSeconds)}</td><td>${s.n ? pct(s.hinted) : '–'}</td><td>${s.n ? pct(s.gaveUp) : '–'}</td><td>${h(s.topTags.join(', '))}</td></tr>`).join('')}
      </tbody></table></div><p class="small muted">Red: over 25% gave up or median over 1.5× target. Amber: over half needed a hint.</p></div>
    <div class="card stack"><h2>Fix it</h2><p class="small">Copies the bible plus every logic issue, AI finding and live-test summary as one prompt. Paste the reply back under <b>Import</b> on the Cases tab to save it as v${S.current.version + 1}.</p>
      <div class="row"><button class="primary" data-act="copyFix">Copy fix prompt</button></div></div>
  </div>`;
}

async function copyText(text, label) {
  try { await navigator.clipboard.writeText(text); toast(`${label} copied`); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast(`${label} copied`); }
}

// ---------- events ----------
async function guard(fn) {
  try { await fn(); }
  catch (e) {
    if (e.errors) { S.draftErrors = e.errors; toast('Schema errors. See the list.'); }
    else { console.error(e); toast(e.message || String(e)); }
  } finally { S.busy = ''; render(); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]');
  if (!t || t.tagName === 'SELECT' || t.tagName === 'INPUT') return;
  if (t.dataset.tab) { e.preventDefault(); S.tab = t.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const a = t.dataset.act, d = t.dataset;
  const L = S.live;
  switch (a) {
    case 'signin': return guard(signIn);
    case 'signout': return guard(signOut);
    case 'open': return guard(() => openCase(d.id));
    case 'sample': return guard(async () => {
      const r = await fetch(`samples/${d.file}`); if (!r.ok) throw new Error(`Couldn't load samples/${d.file}`);
      await importBible(await r.text());
    });
    case 'import': return guard(async () => {
      const f = $('#importFile').files[0];
      await importBible(f ? await f.text() : $('#importText').value);
    });
    case 'validate': {
      const obj = parseJSON($('#json').value);
      S.draft = $('#json').value;
      S.draftErrors = obj ? validateBible(obj).errors : ['That isn\'t valid JSON.'];
      toast(S.draftErrors.length ? `${S.draftErrors.length} schema error(s)` : 'Valid');
      return render();
    }
    case 'saveDraft': return guard(async () => {
      S.draft = $('#json').value;
      const obj = parseJSON(S.draft);
      if (!obj) { S.draftErrors = ['That isn\'t valid JSON.']; return; }
      if (slug(obj.id) !== S.current.caseId && !confirm(`The id changed to "${obj.id}". That saves as a different case. Continue?`)) return;
      await importBible(S.draft);
    });
    case 'download': {
      const blob = new Blob([JSON.stringify(S.current.bible, null, 2)], { type: 'application/json' });
      const u = URL.createObjectURL(blob), link = document.createElement('a');
      link.href = u; link.download = `${S.current.caseId}-v${S.current.version}.json`; link.click(); setTimeout(() => URL.revokeObjectURL(u), 1000);
      return;
    }
    case 'compare': return guard(async () => {
      const va = Number($('#cmpA').value), vb = Number($('#cmpB').value);
      const [A, B] = await Promise.all([loadVersion(S.current.caseId, va), loadVersion(S.current.caseId, vb)]);
      if (!validateBible(A.bible).ok || !validateBible(B.bible).ok) throw new Error('Both versions must pass the schema to compare.');
      S.compare = compareVersions(A.bible, B.bible);
    });
    case 'jump': e.preventDefault(); return jumpTo(d.id);
    case 'logicLevel': S.logicLevel = d.level; return render();
    case 'reportLevel': S.reportLevel = d.level; return render();
    case 'aiLevel': S.aiOpts.level = d.level; return render();
    case 'liveLevel': S.liveSetup.level = d.level; return render();
    case 'runBlind': return guard(runBlind);
    case 'runHunter': return guard(() => runHunter(d.p));
    case 'copyBlind': return copyText(`SYSTEM:\n${blindSystem(S.aiOpts.persona)}\n\nUSER:\n${blindPrompt(S.current.bible, S.aiOpts.level)}`, 'Blind-solver prompt');
    case 'copyHunter': return copyText(`SYSTEM:\n${HUNTER_SYSTEM}\n\nUSER:\n${hunterPrompt(S.current.bible)}`, 'Hunter prompt');
    case 'pasteRun': return guard(async () => {
      const result = parseJSON($('#pasteText').value);
      if (!result) throw new Error('That isn\'t valid JSON.');
      const [kind, provider = 'manual'] = $('#pasteKind').value.split(':');
      if (kind === 'hunter' && !Array.isArray(result.issues)) throw new Error('A hunter result needs {"issues": [...]}.');
      if (kind === 'blind' && !Array.isArray(result.puzzles)) throw new Error('A blind result needs {"puzzles": [...]}.');
      const base = { caseId: S.current.caseId, version: S.current.version, kind, result, usage: null, manual: true };
      S.aiRuns.push(await saveAiRun(kind === 'blind' ? { ...base, provider: 'manual', persona: S.aiOpts.persona, level: S.aiOpts.level } : { ...base, provider }));
      toast('Saved');
    });
    case 'copyFix': return copyText(buildFixPrompt(S.current.bible, S.logic, S.aiRuns, S.sessions), 'Fix prompt');
    case 'liveStart': S.live = newLiveSession(S.current.bible, S.current.caseId, S.current.version, S.liveSetup); S.surveyDraft = {}; persistLive(); return render();
    case 'resume': return guard(async () => {
      const R = S.pendingResume;
      if (!S.current || S.current.caseId !== R.caseId || S.current.version !== R.version) {
        S.cases = await loadCases(); await openCase(R.caseId, R.version);
      }
      S.live = R; S.pendingResume = null; S.surveyDraft = R.surveyDraft || {};
    });
    case 'discard': if (confirm('Throw away the unfinished test?')) { S.pendingResume = null; try { localStorage.removeItem(CONFIG.liveKey); } catch {} persistLive(); } return render();
    case 'hint': {
      const p = L.puzzles[L.current], n = Number(d.n);
      if (p.hints.some(x => x.n === n)) p.hints = p.hints.filter(x => x.n !== n); else p.hints.push({ n, at: Date.now() });
      persistLive(); return render();
    }
    case 'tag': { const p = L.puzzles[L.current]; p.tags = p.tags.includes(d.tag) ? p.tags.filter(x => x !== d.tag) : [...p.tags, d.tag]; persistLive(); return render(); }
    case 'result': liveResult(d.r); return render();
    case 'undo': liveUndo(); return render();
    case 'liveAbort': if (confirm('Abandon this test? Nothing is saved.')) { S.live = null; persistLive(); keepAwake(false); } return render();
    case 'sv': { const v = d.v === 'true' ? true : d.v === 'false' ? false : Number(d.v); S.surveyDraft[d.k] = v; L.surveyDraft = S.surveyDraft; persistLive(); return render(); }
    case 'liveFinish': return guard(async () => {
      const sd = S.surveyDraft;
      if (!sd.fun || !sd.clarity || !sd.difficulty) throw new Error('Fill in fun, clarity and difficulty first.');
      const { surveyDraft, ...session } = L;
      session.survey = { fun: sd.fun, clarity: sd.clarity, difficulty: sd.difficulty, rightCulprit: sd.rightCulprit ?? null, wouldPay: !!sd.wouldPay,
        price: sd.price || '', best: sd.best || '', worst: sd.worst || '', foundLegend: !!sd.foundLegend };
      session.state = 'saved';
      const saved = await saveSession(session);
      S.live = null; persistLive(); S.surveyDraft = {};
      if (S.current && S.current.caseId === saved.caseId && S.current.version === saved.version) S.sessions.push(saved);
      toast('Live test saved');
    });
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'pickversion') return guard(() => openCase(S.current.caseId, Number(t.value)));
  if (t.dataset.act === 'status') return guard(async () => { await setStatus(S.current.caseId, t.value); S.cases = await loadCases(); toast(`Status: ${t.value}`); });
  if (t.dataset.opt) { S.aiOpts[t.dataset.opt] = t.dataset.opt === 'count' ? Number(t.value) : t.value; return render(); }
  if (t.dataset.setup) { S.liveSetup[t.dataset.setup] = t.type === 'checkbox' ? t.checked : t.value; return; }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'json') { S.draft = t.value; syncGutter(); }
  if (t.dataset.setup && t.type !== 'checkbox') S.liveSetup[t.dataset.setup] = t.value;
  if (t.dataset.sv) { S.surveyDraft[t.dataset.sv] = t.value; if (S.live) { S.live.surveyDraft = S.surveyDraft; persistLive(); } }
  if (t.dataset.act === 'note' && S.live) { S.live.puzzles[S.live.current].note = t.value; persistLive(); }
});
document.addEventListener('scroll', e => { if (e.target.id === 'json') syncGutter(); }, true);
document.addEventListener('keydown', e => {
  if (e.target.id === 'json' && e.key === 'Tab') { e.preventDefault(); const ta = e.target, s = ta.selectionStart; ta.setRangeText('  ', s, ta.selectionEnd, 'end'); S.draft = ta.value; }
});

// boot
(async () => {
  if (DEMO) {
    S.user = { uid: 'demo', displayName: 'Demo' };
    await afterLogin();
    S.ready = true;
    render();
  } else {
    render();
    try { await initFirebase(); }
    catch (e) { S.ready = true; render(); toast('Firebase failed to load: ' + e.message); }
  }
})();
</script>
</body>
</html>
