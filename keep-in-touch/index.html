<style>
/* ============================================================ 1. Tokens */
:root {
  --mag: #D60073;
  --black: #000;
  --white: #fff;
  --g1: #f3f3f3;   /* derived greys (black at low alpha on white) */
  --g2: #d4d4d4;
  --g3: #6b6b6b;
  --amber: #b45309;
  --red: #b91c1c;
  --radius: 10px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--white);
  color: var(--black);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}
/* ============================================================ 2. Layout */
header.top {
  background: var(--black);
  color: var(--white);
  padding: 10px 16px;
  padding-top: calc(10px + env(safe-area-inset-top));
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
header.top h1 { font-size: 14px; line-height: 1.2; margin: 0; font-weight: 700; letter-spacing: .01em; min-width: 0; }
header.top #hdrChip { flex: none; }
header.top .mark { display: inline-block; flex: none; width: 22px; height: 22px; border-radius: 5px; background: var(--mag); color: #fff; font-weight: 800; font-size: 14px; text-align: center; line-height: 22px; margin-right: 8px; vertical-align: -4px; }
.strips .strip { padding: 8px 16px; font-size: 14px; color: #fff; }
.strip.amber { background: var(--amber); }
.strip.red { background: var(--red); }
.strip.grey { background: var(--g1); color: var(--black); border-bottom: 1px solid var(--g2); }
.strip button { margin-left: 8px; }
main { padding: 12px 16px calc(84px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; min-height: 60vh; }
h2 { font-size: 20px; margin: 4px 0 12px; }
h3 { font-size: 16px; margin: 18px 0 8px; }
h4 { font-size: 14px; margin: 12px 0 6px; color: var(--g3); text-transform: uppercase; letter-spacing: .04em; }
p { margin: 6px 0; }
.muted { color: var(--g3); font-size: 14px; }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 8px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
/* ============================================================ 3. Cards & chips */
.card { border: 1px solid var(--black); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; background: #fff; }
.card.done { border-color: var(--g2); }
.card.thin { padding: 10px 12px; }
.card .title { font-weight: 700; font-size: 17px; }
.chip { display: inline-block; font-size: 12px; line-height: 20px; border: 1px solid var(--black); border-radius: 999px; padding: 0 9px; white-space: nowrap; }
.chip.mag { background: var(--mag); border-color: var(--mag); color: #fff; }
.chip.grey { border-color: var(--g2); color: var(--g3); }
.chip.amber { background: var(--amber); border-color: var(--amber); color: #fff; }
.chip.red { background: var(--red); border-color: var(--red); color: #fff; }
.chip.black { background: var(--black); color: #fff; }
.badge { display: inline-block; min-width: 18px; height: 18px; line-height: 18px; border-radius: 9px; background: var(--mag); color: #fff; font-size: 11px; font-weight: 700; text-align: center; padding: 0 5px; }
.warn { background: #fff8e1; border: 1px solid var(--amber); color: #7a3a00; border-radius: 8px; padding: 6px 10px; font-size: 14px; margin: 8px 0; }
.note { background: var(--g1); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.pre { white-space: pre-wrap; word-break: break-word; font-size: 14px; }
mark { background: #ffe58a; color: #000; }
/* ============================================================ 4. Controls */
button, .btn {
  min-height: 44px; padding: 8px 14px; border: 1px solid var(--black); background: #fff; color: var(--black);
  border-radius: 8px; font-size: 16px; font-family: inherit; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1.2;
}
button.primary, .btn.primary { background: var(--mag); border-color: var(--mag); color: #fff; font-weight: 600; }
button.ghost, .btn.ghost { border-color: var(--g2); }
button.danger, .btn.danger { border-color: var(--red); color: var(--red); }
button[disabled], .btn[disabled], .btn.disabled { opacity: .4; cursor: not-allowed; pointer-events: none; }
button.sm, .btn.sm { min-height: 36px; padding: 4px 10px; font-size: 14px; }
button.link { border: 0; background: none; color: var(--mag); padding: 0; min-height: 0; text-decoration: underline; font-size: inherit; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btns > * { flex: 1 1 45%; }
.seg { display: inline-flex; border: 1px solid var(--black); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; min-height: 40px; padding: 0 14px; }
.seg button.on { background: var(--black); color: #fff; }
label { display: block; font-size: 14px; font-weight: 600; margin: 10px 0 4px; }
label.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; font-size: 15px; padding: 8px 0; }
label.check input { width: 24px; height: 24px; min-height: 0; margin: 2px 0 0; flex: none; }
input, select, textarea {
  width: 100%; min-height: 44px; font-size: 18px; font-family: inherit; color: var(--black); background: #fff;
  border: 1px solid var(--black); border-radius: 8px; padding: 8px 10px;
}
textarea { min-height: 120px; line-height: 1.4; resize: vertical; font-size: 16px; }
textarea.sms { min-height: 72px; }
input[type=checkbox] { width: auto; }
input:focus, select:focus, textarea:focus, button:focus-visible { outline: 3px solid var(--mag); outline-offset: 1px; }
details { border: 1px solid var(--g2); border-radius: 8px; padding: 6px 10px; margin: 8px 0; }
details summary { cursor: pointer; font-size: 14px; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--g2); vertical-align: top; }
th { font-size: 12px; color: var(--g3); text-transform: uppercase; letter-spacing: .04em; }
td.num, th.num { text-align: right; }
.list .item { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--g2); cursor: pointer; min-height: 56px; }
.list .item .l { min-width: 0; }
.list .item .name { font-weight: 600; }
.list .item .sub { font-size: 13px; color: var(--g3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.results { border: 1px solid var(--black); border-top: 0; border-radius: 0 0 8px 8px; margin-top: -8px; max-height: 220px; overflow: auto; }
.results button { display: block; width: 100%; border: 0; border-bottom: 1px solid var(--g2); border-radius: 0; text-align: left; justify-content: flex-start; }
.stat { flex: 1 1 30%; border: 1px solid var(--g2); border-radius: 8px; padding: 8px; text-align: center; }
.stat b { display: block; font-size: 22px; }
.stat span { font-size: 12px; color: var(--g3); }
.tl .entry { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--g2); }
.tl .dot { width: 10px; height: 10px; border-radius: 5px; background: var(--black); flex: none; margin-top: 6px; }
.tl .dot.reply { background: var(--mag); }
.tl .dot.skip { background: var(--g2); }
.tl .body { min-width: 0; flex: 1; }
.tl .when { font-size: 12px; color: var(--g3); }
/* ============================================================ 5. Tab bar */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; display: flex; background: var(--black);
  padding-bottom: env(safe-area-inset-bottom); z-index: 20; border-top: 1px solid #222;
}
nav.tabs button {
  flex: 1; min-height: 56px; border: 0; border-radius: 0; background: none; color: #fff; font-size: 11px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 6px 0; position: relative;
}
nav.tabs button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button.active { color: var(--mag); }
nav.tabs .badge { position: absolute; top: 4px; left: 50%; margin-left: 6px; }
/* ============================================================ 6. Toast, unsub page */
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(76px + env(safe-area-inset-bottom)); background: var(--black); color: #fff; padding: 12px 14px; border-radius: 8px; font-size: 15px; z-index: 30; display: none; box-shadow: 0 4px 16px rgba(0,0,0,.3); }
#toast.err { background: var(--red); }
#toast.show { display: block; }
.unsub { max-width: 480px; margin: 12vh auto 0; padding: 0 16px; }
.unsub h1 { font-size: 26px; }
.sr { position: absolute; left: -9999px; }
@media (min-width: 700px) { .btns > * { flex: 0 1 auto; } }
</style>

<!-- ============================================================ Shared libraries (verbatim; see test/build-check.js) -->
<script>/* <!-- BEGIN engine.js --> */
/*
 * North Star Keep-In-Touch — cadence & selection engine (Agent 2)
 *
 * UMD. In Node: `const KIT = require('./lib/engine.js')`. In the browser
 * (inlined into index.html): `window.KIT`. Zero dependencies, no I/O.
 *
 * Every function is pure. The only place the wall clock is read is
 * todayChicago() / nowChicagoHour(), which use Intl with America/Chicago.
 * All date math is on 'YYYY-MM-DD' strings via Date.UTC so the machine's
 * local timezone can never leak into a schedule.
 *
 * See SPEC.md §4 for the contract and docs/02-cadence.md for the plain-English
 * explanation of the rules.
 *
 * render() placeholders: {first} {name} {vehicle} {year} {make} {model}
 * {phone} {sale_year} {season} {hook|fallback} {referred|fallback}.
 * {referred} is the first name of the person a customer sent in (REFERRAL_THANKS):
 * it comes from opts.referred (or opts.referredName), else from
 * customer.pendingThanks.referredName. Anything the engine cannot fill renders
 * as [key] and is listed in the returned `missing` array.
 */
(function (root, factory) {
  if (typeof module === 'object' && module && module.exports) {
    module.exports = factory();
  } else {
    root.KIT = factory();
  }
})(typeof window !== 'undefined' ? window : this, function () {
  'use strict';

  var VERSION = '1.1.0';

  var SLOTS = [
    'THANKS',              // touch 0
    'THANKS_REPEAT',       // touch 0 of a repeat purchase
    'VALUE',               // odd touches
    'CHECKIN',             // touches 2, 6, 10 ...
    'REFERRAL',            // touches 4, 8, 12 ...
    'ANNIVERSARY_REFERRAL',// a REFERRAL that lands within ±30 days of a sale anniversary
    'BIRTHDAY',            // any touch ≥ 1 within ±14 days of the birthday (displaces, carries)
    'REFERRAL_THANKS',     // immediate, out-of-cadence, does not consume a touch number
    'GOODBYE'              // opt-out confirmation
  ];

  var TOUCH0_OFFSET_DAYS = 3;
  var CADENCE_DAYS = 90;
  var BIRTHDAY_WINDOW_DAYS = 14;
  var ANNIVERSARY_WINDOW_DAYS = 30;
  var DEFAULT_MIN_GAP_DAYS = 21;
  var MS_PER_DAY = 86400000;

  // ---------------------------------------------------------------- dates

  function isYmd(s) {
    return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
  }

  function pad2(n) {
    return (n < 10 ? '0' : '') + n;
  }

  function parseYmd(ymd) {
    if (!isYmd(ymd)) throw new Error('KIT: bad date "' + ymd + '" (want YYYY-MM-DD)');
    var y = +ymd.slice(0, 4), m = +ymd.slice(5, 7), d = +ymd.slice(8, 10);
    return Date.UTC(y, m - 1, d);
  }

  function formatUtc(ms) {
    var dt = new Date(ms);
    return dt.getUTCFullYear() + '-' + pad2(dt.getUTCMonth() + 1) + '-' + pad2(dt.getUTCDate());
  }

  function addDays(ymd, n) {
    return formatUtc(parseYmd(ymd) + Math.round(n) * MS_PER_DAY);
  }

  // diffDays(a, b) = b - a in whole days.
  function diffDays(a, b) {
    return Math.round((parseYmd(b) - parseYmd(a)) / MS_PER_DAY);
  }

  function maxYmd(a, b) {
    if (!isYmd(a)) return b;
    if (!isYmd(b)) return a;
    return a >= b ? a : b;
  }

  function isLeapYear(y) {
    return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
  }

  // Build a YYYY-MM-DD from a year and an 'MM-DD'. Feb 29 in a non-leap year
  // becomes Feb 28. Returns null for garbage.
  function ymdFromMonthDay(year, mmdd) {
    if (typeof mmdd !== 'string' || !/^\d{2}-\d{2}$/.test(mmdd)) return null;
    var m = +mmdd.slice(0, 2), d = +mmdd.slice(3, 5);
    if (m < 1 || m > 12 || d < 1 || d > 31) return null;
    if (m === 2 && d === 29 && !isLeapYear(year)) d = 28;
    var dim = [31, isLeapYear(year) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
    if (d > dim) d = dim;
    return year + '-' + pad2(m) + '-' + pad2(d);
  }

  function todayChicago() {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var o = {};
    for (var i = 0; i < parts.length; i++) o[parts[i].type] = parts[i].value;
    return o.year + '-' + o.month + '-' + o.day;
  }

  function nowChicagoHour() {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/Chicago', hour: 'numeric', hourCycle: 'h23'
    }).formatToParts(new Date());
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].type === 'hour') return (+parts[i].value) % 24;
    }
    return 0;
  }

  function seasonFor(ymd) {
    var m = +String(ymd).slice(5, 7);
    if (m === 12 || m === 1 || m === 2) return 'winter';
    if (m >= 3 && m <= 5) return 'spring';
    if (m >= 6 && m <= 8) return 'summer';
    return 'fall';
  }

  // ------------------------------------------------------------- cadence

  // 0 THANKS, odd VALUE, n%4==2 CHECKIN, n%4==0 REFERRAL
  function baseSlot(n) {
    if (n === 0) return 'THANKS';
    if (n % 2 === 1) return 'VALUE';
    return n % 4 === 2 ? 'CHECKIN' : 'REFERRAL';
  }

  // Due date for touch n. n==0: saleDate + 3. Otherwise anchorDate +
  // 90 * (n - anchorTouchN). If a min-gap floor was stored by a late 'sent'
  // event it applies to the very next touch (n === nextTouchN) only.
  function touchDate(customer, n) {
    if (!customer || !isYmd(customer.saleDate)) return null;
    var computed;
    if (n === 0) {
      computed = addDays(customer.saleDate, TOUCH0_OFFSET_DAYS);
    } else {
      var anchorDate = isYmd(customer.anchorDate) ? customer.anchorDate : customer.saleDate;
      var anchorN = typeof customer.anchorTouchN === 'number' ? customer.anchorTouchN : 0;
      computed = addDays(anchorDate, CADENCE_DAYS * (n - anchorN));
    }
    var nextN = typeof customer.nextTouchN === 'number' ? customer.nextTouchN : 0;
    if (n === nextN && isYmd(customer.floorDate) && customer.floorDate > computed) {
      return customer.floorDate;
    }
    return computed;
  }

  // Nearest occurrence of an 'MM-DD' birthday to dueDate: consider the
  // occurrence in dueDate's year and the years either side; return the
  // smallest absolute distance in days, or null if no valid birthday.
  function daysToBirthday(birthday, dueDate) {
    if (!birthday || !isYmd(dueDate)) return null;
    var year = +dueDate.slice(0, 4);
    var best = null;
    for (var y = year - 1; y <= year + 1; y++) {
      var occ = ymdFromMonthDay(y, birthday);
      if (!occ) return null;
      var d = Math.abs(diffDays(occ, dueDate));
      if (best === null || d < best) best = d;
    }
    return best;
  }

  // Distance in days from dueDate to the nearest sale anniversary (year 1, 2,
  // 3 ...; never the sale date itself). Feb 29 anniversaries fall on Feb 28 in
  // non-leap years. Returns { days, year } or null.
  function nearestAnniversary(saleDate, dueDate) {
    if (!isYmd(saleDate) || !isYmd(dueDate)) return null;
    var saleYear = +saleDate.slice(0, 4);
    var mmdd = saleDate.slice(5);
    var approx = Math.floor(diffDays(saleDate, dueDate) / 365);
    var best = null;
    for (var k = approx - 1; k <= approx + 1; k++) {
      if (k < 1) continue;
      var occ = ymdFromMonthDay(saleYear + k, mmdd);
      var d = Math.abs(diffDays(occ, dueDate));
      if (best === null || d < best.days) best = { days: d, year: k };
    }
    return best;
  }

  // Decide the slot for touch n on dueDate. Returns
  // { slot, carried, base, viaCredit, anniversaryYear }.
  //   carried    = a birthday note displaced `base`; the caller bumps slotOffset
  //   viaCredit  = a REFERRAL became VALUE because of referralCredit
  function resolveSlot(customer, n, dueDate) {
    var out = { slot: null, carried: false, base: null, viaCredit: false, anniversaryYear: 0 };
    if (n === 0) {
      var repeat = Array.isArray(customer.purchases) && customer.purchases.length > 1;
      out.slot = out.base = repeat ? 'THANKS_REPEAT' : 'THANKS';
      return out;
    }
    var offset = typeof customer.slotOffset === 'number' ? customer.slotOffset : 0;
    var k = n - offset;
    if (k < 1) k = 1;
    var effective = baseSlot(k);
    var viaCredit = false;
    if (effective === 'REFERRAL' && customer.referralCredit) {
      effective = 'VALUE';
      viaCredit = true;
    }
    if (effective === 'REFERRAL') {
      var ann = nearestAnniversary(customer.saleDate, dueDate);
      if (ann && ann.days <= ANNIVERSARY_WINDOW_DAYS) {
        effective = 'ANNIVERSARY_REFERRAL';
        out.anniversaryYear = ann.year;
      }
    }
    out.base = effective;
    if (customer.birthday) {
      var d = daysToBirthday(customer.birthday, dueDate);
      if (d !== null && d <= BIRTHDAY_WINDOW_DAYS) {
        out.slot = 'BIRTHDAY';
        out.carried = true;
        return out;
      }
    }
    out.slot = effective;
    out.viaCredit = viaCredit;
    return out;
  }

  // The message goes out on max(dueDate, today), so that is the season that
  // should drive the seasonal VALUE pool ("don't send an ice-scraper tip in July").
  function sendSeason(dueDate, today) {
    return seasonFor(isYmd(today) && today > dueDate ? today : dueDate);
  }

  function nextTouch(customer, today) {
    if (!customer || customer.status === 'dnc') return null;
    if (!isYmd(customer.saleDate)) return null;
    today = isYmd(today) ? today : todayChicago();
    var n = typeof customer.nextTouchN === 'number' ? customer.nextTouchN : 0;
    var dueDate = touchDate(customer, n);
    var r = resolveSlot(customer, n, dueDate);
    var snoozedUntil = isYmd(customer.snoozedUntil) ? customer.snoozedUntil : '';
    var snoozed = !!snoozedUntil && snoozedUntil > today;
    var isLate = dueDate < today;
    return {
      n: n,
      dueDate: dueDate,
      slot: r.slot,
      carried: r.carried,
      base: r.base,
      viaCredit: r.viaCredit,
      anniversaryYear: r.anniversaryYear,
      isDue: dueDate <= today && !snoozed,
      isLate: isLate,
      daysLate: isLate ? diffDays(dueDate, today) : 0,
      snoozed: snoozed,
      snoozedUntil: snoozedUntil,
      season: sendSeason(dueDate, today)
    };
  }

  // Simulate the next `count` touches from the customer's current state,
  // applying birthday carries, credit consumption and the min-gap floor as it
  // goes. Each simulated touch is "sent" on max(dueDate, today).
  function previewTouches(customer, count, today) {
    count = typeof count === 'number' && count > 0 ? count : 8;
    today = isYmd(today) ? today : todayChicago();
    var sim = clone(customer);
    var out = [];
    for (var i = 0; i < count; i++) {
      var nt = nextTouch(sim, today);
      if (!nt) break;
      out.push({ n: nt.n, dueDate: nt.dueDate, slot: nt.slot, carried: nt.carried, season: nt.season });
      var sentDate = maxYmd(nt.dueDate, today);
      sim = applyEvent(sim, { type: 'sent', n: nt.n, dueDate: nt.dueDate, sentDate: sentDate, channels: [] }, today);
    }
    return out;
  }

  function byDueThenName(a, b) {
    if (a.dueDate !== b.dueDate) return a.dueDate < b.dueDate ? -1 : 1;
    var an = String(a.customer.name || ''), bn = String(b.customer.name || '');
    return an < bn ? -1 : an > bn ? 1 : 0;
  }

  // One item per active customer whose next touch is due, oldest first.
  function buildQueue(customers, today) {
    today = isYmd(today) ? today : todayChicago();
    var items = [];

    var ok = lsSet(LS.db, { customers: db.customers, touches: db.touches, replies: db.replies, templates: db.templates, settings: db.settings, heartbeat: db.heartbeat, lastSync: this.lastSync });

  // Apply a write to the in-memory db and cache, then queue it for Firebase.
  save: function (coll, id, obj) {
    obj = clone(obj);

    else if (coll === 'heartbeat') db.heartbeat = obj;
    else db[coll][id] = obj;
    this.persist();
    if (this.mode === 'firebase') this.enqueue({ op: 'set', path: coll + '/' + id, data: obj });
  },
  remove: function (coll, id) {
    if (coll === 'settings') db.settings = defaultSettings();
    else if (coll === 'heartbeat') db.heartbeat = null;
    else delete db[coll][id];

    if (this.mode === 'firebase') this.enqueue({ op: 'delete', path: coll + '/' + id });

  enqueue: function (item) {
    // Collapse earlier writes to the same path: only the latest matters.

    this.flush();

  // Push queued writes in order. Stops (and keeps the rest) on a network error.
  flush: function () {

        self.outbox.shift();
        lsSet(LS.outbox, self.outbox);
        self.setOffline(false);
        return next();
      }, function (e) {
        if (e && e.status && e.status !== 401 && e.status !== 429 && e.status < 500) {
          // Permanent rejection (rules, bad data): drop it so the queue is not stuck forever.
          self.outbox.shift();
          lsSet(LS.outbox, self.outbox);
          toast('Firebase rejected a write (' + item.path + '): ' + errMsg(e), 'err');
          return next();
        }

        self.setOffline(true);
      });
    })().then(function () { self.flushing = false; renderChrome(); }, function () { self.flushing = false; renderChrome(); });
  },

  setOffline: function (flag) {
    if (this.offline !== flag) { this.offline = flag; renderChrome(); }
  },

  load: function () {
    var self = this;

    self.loading = true;
    renderChrome();
    return Promise.all([
      FS.list('customers'), FS.list('touches'), FS.list('replies'), FS.list('templates'),
      FS.get('settings/main'), FS.get('heartbeat/daily')
    ]).then(function (r) {
      var fresh = emptyDb();
      [['customers', 0], ['touches', 1], ['replies', 2], ['templates', 3]].forEach(function (pair) {
        r[pair[1]].forEach(function (row) { fresh[pair[0]][row.id] = row.data; });
      });
      fresh.settings = Object.assign(defaultSettings(), r[4] || {});
      fresh.settings.firebase = self.fb;
      fresh.heartbeat = r[5] || null;
      self.outbox.forEach(function (item) {
        var seg = item.path.split('/');
        if (item.op === 'delete') { if (seg[0] === 'settings') fresh.settings = defaultSettings(); else if (seg[0] === 'heartbeat') fresh.heartbeat = null; else delete fresh[seg[0]][seg[1]]; }
        else if (seg[0] === 'settings') fresh.settings = item.data;
        else if (seg[0] === 'heartbeat') fresh.heartbeat = item.data;
        else if (fresh[seg[0]]) fresh[seg[0]][seg[1]] = item.data;
      });
      db = fresh;
      self.lastSync = nowIso();
      self.persist();
      self.setOffline(false);
      self.loading = false;
      return true;
    }, function (e) {
      self.loading = false;
      if (e && e.status === 401) toast('Firebase sign-in expired. Sign in again in Settings.', 'err');
      else if (e && e.status === 403) toast('Firestore denied access: check firestore.rules has your UID.', 'err');
      else self.setOffline(true);
      renderChrome();
      return false;
    });
  },

  // Push everything in the local db into the outbox (used when connecting Firebase).
  migrateLocal: function () {
    var self = this;
    var count = 0;
    ['customers', 'touches', 'replies', 'templates'].forEach(function (coll) {
      Object.keys(db[coll]).forEach(function (id) { self.outbox.push({ op: 'set', path: coll + '/' + id, data: db[coll][id] }); count++; });
    });
    var s = clone(db.settings); s.firebase = self.fb;
    self.outbox.push({ op: 'set', path: 'settings/main', data: s }); count++;

    return count;
  }
};

var AUTH = {
  signIn: function (email, password) {
    var url = 'https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=' + encodeURIComponent(store.fb.apiKey);

      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.j && res.j.error && res.j.error.message) || 'Sign-in failed');
        store.auth = { uid: res.j.localId, email: res.j.email || email, idToken: res.j.idToken, refreshToken: res.j.refreshToken, issuedAt: Date.now() };

  },
  signOut: function () { store.auth = null; lsSet(LS.auth, null); },
  refresh: function () {

    return fetch(url, { method: 'POST', headers: { 'content-type': 'application/x-www-form-urlencoded' }, body: body })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        if (!res.ok) {
          var e = new Error((res.j && res.j.error && res.j.error.message) || 'Token refresh failed');
          e.status = res.status === 400 ? 401 : res.status;

        }

        lsSet(LS.auth, store.auth);

  token: function (force) {

/* ---- Firestore (REST) ---- */
var FS = {
  base: function () { return 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(store.fb.projectId) + '/databases/(default)/documents'; },
  docUrl: function (path) { return FS.base() + '/' + String(path).split('/').map(encodeURIComponent).join('/'); },
  call: function (method, url, body, retried) {
    return AUTH.token().then(function (token) {
      return fetch(url, { method: method, headers: { authorization: 'Bearer ' + token, 'content-type': 'application/json' }, body: body === undefined ? undefined : JSON.stringify(body) });
    }).then(function (r) {
      return r.text().then(function (text) {
        var json = null;
        try { json = text ? JSON.parse(text) : null; } catch (e) { json = null; }
        if (r.status === 401 && !retried) return AUTH.token(true).then(function () { return FS.call(method, url, body, true); });
        if (!r.ok) {
          var err = new Error('Firestore ' + method + ' ' + r.status + ': ' + ((json && json.error && json.error.message) || text.slice(0, 200)));
          err.status = r.status;
          throw err;
        }
        return json;
      });
    });
  },
  get: function (path) {
    return FS.call('GET', FS.docUrl(path)).then(decode, function (e) { if (e.status === 404) return null; throw e; });
  },
  set: function (path, data) { return FS.call('PATCH', FS.docUrl(path), encode(data)).then(decode); },
  update: function (path, data) {
    var keys = Object.keys(data || {}).filter(function (k) { return data[k] !== undefined; });
    if (!keys.length) return FS.get(path);
    var mask = keys.map(function (k) { return 'updateMask.fieldPaths=' + encodeURIComponent(/^[A-Za-z_][A-Za-z0-9_]*$/.test(k) ? k : '`' + k.replace(/`/g, '\\`') + '`'); }).join('&');
    return FS.call('PATCH', FS.docUrl(path) + '?' + mask, encode(data)).then(decode);
  },
  del: function (path) { return FS.call('DELETE', FS.docUrl(path)).then(function () { return true; }); },
  list: function (collection) {
    var out = [];
    function page(token) {
      var qs = 'pageSize=300' + (token ? '&pageToken=' + encodeURIComponent(token) : '');
      return FS.call('GET', FS.docUrl(collection) + '?' + qs).then(function (res) {
        ((res && res.documents) || []).forEach(function (doc) { out.push({ id: docId(doc), data: decode(doc) }); });
        return (res && res.nextPageToken) ? page(res.nextPageToken) : out;
      });
    }
    return page('');
  }
};

  live.forEach(function (it) { out.push(renderCard(draftFor(it), false)); });
  return raw(out.map(part).join(''));
}

function renderCard(st, done) {
  var it = st.item;
  var c = getCustomer(st.customerId) || it.customer;
  var canE = COMPLIANCE.canEmail(c), canT = COMPLIANCE.canText(c);
  var hasE = st.channels.indexOf('email') !== -1, hasT = st.channels.indexOf('sms') !== -1;
  var late = it.daysLate > 0;
  var chips = [
    html`<span class="chip mag">${SLOT_LABEL[it.slot] || it.slot}</span>`,
    it.extra ? '' : html`<span class="chip grey">touch ${it.n}</span>`,
    late ? html`<span class="chip amber">${it.daysLate} day${it.daysLate === 1 ? '' : 's'} late</span>` : '',
    it.forced ? html`<span class="chip grey">early · due ${fmtDate(it.dueDate)}</span>` : '',
    html`<span class="chip ${canE ? '' : 'grey'}">email ${canE ? 'yes' : 'no'}</span>`,
    html`<span class="chip ${canT ? '' : 'grey'}">text ${canT ? 'yes' : 'no'}</span>`
  ];
  var verify = /\[VERIFY[^\]]*\]/.test(st.email + st.text + st.subject);
  var emailReason = !canE ? (c.status === 'dnc' ? 'do not contact' : !(c.emailConsent && c.emailConsent.given) ? 'no email consent' : 'no email address') : '';
  var textReason = !canT ? (c.status === 'dnc' ? 'do not contact' : !(c.smsConsent && c.smsConsent.given) ? 'no text consent' : 'no phone') : '';
  return html`<div class="card ${done ? 'done' : ''}" data-key="${st.key}">
    <div class="row between">
      <div><span class="title" data-act="open" data-id="${c.id}" role="link">${c.name}</span><div class="muted">${c.vehicleLabel || ''}${it.extra && it.referredName ? ' · sent ' + it.referredName : ''}</div></div>
      ${done ? html`<span class="chip black">sent ${st.channels.map(function (x) { return x === 'sms' ? 'text' : x; }).join(' + ')}</span>` : ''}
    </div>
    <div class="row" style="margin:8px 0">${chips}</div>
    ${st.noTemplate ? html`<div class="warn">No live template for this slot. Un-retire one on the Templates tab.</div>` : ''}
    ${st.missing.length ? html`<div class="warn">Fill in: ${st.missing.join(', ')} — the draft shows it as [${st.missing[0]}].</div>` : ''}
    ${verify ? html`<div class="warn">Contains <mark>[VERIFY NUMBER]</mark> — replace it before sending.</div>` : ''}
    ${st.editHint ? html`<p class="small muted">Tip: ${st.editHint}</p>` : ''}
    <label>Subject</label>
    <input type="text" value="${st.subject}" data-on-input="cardEdit" data-key="${st.key}" data-field="subject" ${done ? 'readonly' : ''}>
    <label>Email <span class="muted">(footer added on send)</span></label>
    <textarea data-on-input="cardEdit" data-key="${st.key}" data-field="email" ${done && hasE ? 'readonly' : ''}>${st.email}</textarea>
    <details><summary>Footer that goes under it</summary><div class="pre muted">${highlightVerify(st.footer)}</div></details>
    <label>Text</label>
    <textarea class="sms" data-on-input="cardEdit" data-key="${st.key}" data-field="text" ${done && hasT ? 'readonly' : ''}>${st.text}</textarea>
    <div class="btns">
      ${hasE ? html`<button type="button" disabled>Email sent</button>` : html`<button type="button" class="primary" data-act="sendEmail" data-key="${st.key}" ${canE && !st.noTemplate ? '' : 'disabled'} title="${emailReason}">Send Email${emailReason ? ' · ' + emailReason : ''}</button>`}
      ${hasT ? html`<button type="button" disabled>Text sent</button>` : (canT && !st.noTemplate
        ? html`<a class="btn" href="${smsHref(c, st.text)}" data-act="sendSms" data-key="${st.key}">Send as Text</a>`
        : html`<a class="btn disabled" aria-disabled="true">Send as Text · ${textReason}</a>`)}
      <button type="button" data-act="copyText" data-key="${st.key}" ${st.noTemplate ? 'disabled' : ''}>Copy Text</button>
      ${done ? html`<button type="button" class="ghost" data-act="dismiss" data-key="${st.key}">Done</button>` : html`<button type="button" class="ghost" data-act="skip" data-key="${st.key}">Skip</button>`}
      ${done || it.extra ? '' : html`<button type="button" class="ghost" data-act="snooze" data-key="${st.key}">Snooze 7d</button>`}
    </div>
  </div>`;
}

// Record a channel on the card's touch. First channel creates the touch doc
// and applies the engine event; a later channel updates the same touch doc.
function recordChannel(st, ch, extra) {
  extra = extra || {};
  var c = getCustomer(st.customerId);
  if (!c) throw new Error('Customer no longer exists');
  var it = st.item;
  var t = today(), iso = nowIso();
  var s = settings();
  var fullEmail = st.email + '\n\n' + st.footer;
  if (!st.touchId) st.touchId = newId();
  var touch = db.touches[st.touchId];
  if (!touch) {
    touch = {
      id: st.touchId, customerId: c.id, customerName: c.name || '', touchN: it.extra ? -1 : it.n, slot: it.slot,
      templateId: st.templateId, season: it.season || 'any', dueDate: it.dueDate, status: 'sent', sentAt: iso, sentDate: t,
      channels: [ch], sentBy: st.sender, subject: st.subject, emailBody: ch === 'email' ? fullEmail : '', textBody: ch === 'sms' ? st.text : '',
      providerId: extra.providerId || '', late: !!it.isLate, daysLate: Number(it.daysLate) || 0, createdAt: iso, updatedAt: iso
    };
    store.save('touches', touch.id, touch);
    var ev = it.extra
      ? { type: 'sentExtra', sentDate: t, sentAt: iso, templateId: st.templateId, channels: [ch], minGapDays: s.minGapDays }
      : { type: 'sent', n: it.n, dueDate: it.dueDate, slot: it.slot, carried: !!it.carried, channels: [ch], sentDate: t, sentAt: iso, templateId: st.templateId, minGapDays: s.minGapDays, touchId: touch.id };
    var updated = KIT.applyEvent(c, ev, t);
    updated.lastSentAt = iso;
    saveCustomer(updated);
  } else {
    if (touch.channels.indexOf(ch) === -1) touch.channels.push(ch);
    if (ch === 'email') { touch.emailBody = fullEmail; touch.providerId = extra.providerId || touch.providerId || ''; touch.subject = st.subject; }
    if (ch === 'sms') touch.textBody = st.text;
    touch.updatedAt = iso;
    store.save('touches', touch.id, touch);
    if (ch === 'sms' && !c.firstTextSentAt) { c.firstTextSentAt = iso; c.lastSentAt = iso; saveCustomer(c); }
  }
  if (st.channels.indexOf(ch) === -1) st.channels.push(ch);
  st.done = true;
  if (ui.forceCustomer === c.id) ui.forceCustomer = '';
}

function postSend(payload) {
  var s = settings();
  if (!s.sendSecret) return Promise.reject(new Error('Add the send secret in Settings first (same value as KIT_SECRET in Netlify).'));
  return fetch('/.netlify/functions/send', { method: 'POST', headers: { 'content-type': 'application/json', 'x-kit-secret': s.sendSecret }, body: JSON.stringify(payload) })
    .then(function (r) { return r.text().then(function (text) { var j = null; try { j = JSON.parse(text); } catch (e) { j = null; } return { ok: r.ok, status: r.status, j: j, text: text }; }); })
    .then(function (res) {
      if (!res.ok || !res.j || !res.j.ok) throw new Error((res.j && res.j.error) || ('Send failed (' + res.status + ')'));
      return res.j;
    });
}

function sendEmailFor(st) {
  var c = getCustomer(st.customerId);
  if (!c || !COMPLIANCE.canEmail(c)) return Promise.reject(new Error('Cannot email ' + (c ? c.name : 'this customer')));
  if (st.channels.indexOf('email') !== -1) return Promise.resolve();
  if (!st.touchId) st.touchId = newId();
  return postSend({
    to: String(c.email).trim().toLowerCase(), toName: c.name || '', subject: st.subject, text: st.email + '\n\n' + st.footer,
    customerId: c.id, touchId: st.touchId, unsubscribeUrl: st.unsubscribeUrl
  }).then(function (j) {
    recordChannel(st, 'email', { providerId: j.id || '' });
    if (j.warning) toast(j.warning, 'err');
  });
}

function copyToClipboard(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).catch(function () { return legacyCopy(text); });
  return Promise.resolve(legacyCopy(text));
}
function legacyCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text; ta.className = 'sr';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}
ACTIONS.skip = function (t) {

  var c = getCustomer(st.customerId);

  var it = st.item, tday = today(), iso = nowIso();

    subject: '', emailBody: '', textBody: '', providerId: '', late: !!it.isLate, daysLate: Number(it.daysLate) || 0, createdAt: iso, updatedAt: iso
  };

ACTIONS.approveAll = function (t) {
  var live = queueItems().filter(function (it) { var st = cardState[cardKey(it)]; return !(st && st.done); });
  var ready = [], skipped = [];
  live.forEach(function (it) {
    var st = draftFor(it);
    if (!COMPLIANCE.canEmail(it.customer)) return;
    if (st.missing.length || st.noTemplate || /\[VERIFY[^\]]*\]/.test(st.email + st.subject)) skipped.push(it.customer.name); else ready.push(st);
  });
  if (!ready.length) { toast(skipped.length ? 'Nothing ready: fill in placeholders first (' + skipped.join(', ') + ')' : 'Nothing to email', 'err'); return; }
  if (!confirm('Send ' + ready.length + ' email' + (ready.length === 1 ? '' : 's') + ' now?' + (skipped.length ? '\n\nSkipping (placeholders to fill in): ' + skipped.join(', ') : ''))) return;
  t.disabled = true;
  var sent = 0, failed = [];
  return ready.reduce(function (p, st) {
    return p.then(function () { return sendEmailFor(st).then(function () { sent++; }, function (e) { failed.push((getCustomer(st.customerId) || {}).name + ': ' + errMsg(e)); }); });
  }, Promise.resolve()).then(function () {
    render();
    toast('Sent ' + sent + ' email' + (sent === 1 ? '' : 's') + (failed.length ? ' · failed: ' + failed.join('; ') : '') + (skipped.length ? ' · skipped ' + skipped.length + ' with placeholders' : ''), failed.length ? 'err' : '');
  });
};

  var vehicle = { year: o.year ? Number(o.year) : '', make: o.make.trim(), model: o.model.trim(), trim: o.trim.trim() };
  var label = vehicleLabelOf(vehicle);
  var birthday = o.bmonth && o.bday ? o.bmonth + '-' + o.bday : '';
  var emailConsent = { given: !!o.emailGiven, at: o.emailGiven ? (o.emailAt || iso) : '', how: o.emailGiven ? o.emailHow : '' };
  var smsConsent = { given: !!o.smsGiven, at: o.smsGiven ? (o.smsAt || iso) : '', how: o.smsGiven ? o.smsHow : '' };
  var contact = { name: o.name.trim(), first: firstNameOf(o.name), phone: digitsOnly(o.phone), email: o.email.trim().toLowerCase(), birthday: birthday, hook: o.hook.trim(), notes: o.notes, emailConsent: emailConsent, smsConsent: smsConsent };

  if (ui.editId) {
    var ex = getCustomer(ui.editId);
    if (!ex) { toast('Customer not found', 'err'); return; }
    var wasRef = ex.referredBy;
    Object.assign(ex, contact, { vehicle: vehicle, vehicleLabel: label });
    if (ex.saleDate !== o.saleDate) {
      if (!ex.nextTouchN && (!ex.anchorDate || ex.anchorDate === ex.saleDate)) ex.anchorDate = o.saleDate;
      ex.saleDate = o.saleDate;
      if (Array.isArray(ex.purchases) && ex.purchases.length) { var last = ex.purchases[ex.purchases.length - 1]; last.saleDate = o.saleDate; last.vehicle = vehicle; last.vehicleLabel = label; }
    }
    if (!ex.unsubscribeToken) ex.unsubscribeToken = newToken();
    saveCustomer(ex);
    void wasRef;
    toast('Saved ' + ex.name);
    ui.editId = null;
    openCustomer(ex.id);
    return;
  }

  if (ui.repeatMode) {
    var rc = ui.repeatOf ? getCustomer(ui.repeatOf) : null;
    if (!rc) { toast('Pick which customer bought again', 'err'); return; }
    var up = KIT.applyEvent(rc, { type: 'repeatPurchase', saleDate: o.saleDate, vehicle: vehicle, vehicleLabel: label }, t);
    Object.assign(up, contact);
    if (!up.unsubscribeToken) up.unsubscribeToken = newToken();
    saveCustomer(up);
    Object.keys(cardState).forEach(function (k) { if (cardState[k].customerId === up.id) delete cardState[k]; });
    ui.repeatMode = false; ui.repeatOf = '';
    toast('Repeat purchase saved for ' + up.name);
    openCustomer(up.id);
    return;
  }

  var id = newId();
  var referrer = o.referredBy ? getCustomer(o.referredBy) : null;
  var c = Object.assign({
    id: id, vehicle: vehicle, vehicleLabel: label, saleDate: o.saleDate,
    referredBy: referrer ? referrer.id : '', referredByName: referrer ? referrer.name : '',
    attributedTouchId: referrer ? STATS.suggestAttributedTouch(referrer.id, touchesArr(), t) : '',
    status: 'active', dnc: null, anchorDate: o.saleDate, anchorTouchN: 0, nextTouchN: 0, slotOffset: 0, referralCredit: false,
    snoozedUntil: '', lastSentAt: '', lastSentDate: '', lastReplyAt: '', lastReplyDate: '', firstTextSentAt: '', floorDate: '',
    usedTemplateIds: [], unreadReplies: 0, unsubscribeToken: newToken(), pendingThanks: null,
    purchases: [{ saleDate: o.saleDate, vehicle: vehicle, vehicleLabel: label }], createdAt: iso, updatedAt: iso
  }, contact);
  store.save('customers', id, c);
  if (referrer) {
    saveCustomer(KIT.applyEvent(referrer, { type: 'referralReceived', date: t, referredName: firstNameOf(c.name) }, t));
    toast('Saved ' + c.name + '. A thank-you for ' + referrer.name + ' is in the queue.');
  } else toast('Saved ' + c.name + '. First note is due ' + fmtDate(KIT.addDays(o.saleDate, 3)) + '.');
  openCustomer(id);
};

function timelineEntries(c) {

ACTIONS.backPeople = function () { ui.customerId = null; ui.replyOpen = null; go('people'); };

  touchesArr().filter(function (x) { return x.customerId === c.id; }).forEach(function (x) { store.remove('touches', x.id); });

function logReply(c, channel, text, opts) {

  var t = today(), iso = nowIso();
  var reply = { id: newId(), customerId: c.id, customerName: c.name || '', touchId: '', slot: '', templateId: '', receivedAt: iso, receivedDate: t, channel: channel, source: 'manual', from: '', subject: '', snippet: String(text || '').slice(0, 1000), isOptOut: !!opts.isOptOut, processed: true, createdAt: iso };
  var att = STATS.attributeReply({ customerId: c.id, receivedDate: t }, touchesArr());
  if (att) { reply.touchId = att.id || ''; reply.slot = att.slot || ''; reply.templateId = att.templateId || ''; }

FORMS.reply = function (f) {

      ui.replyOpen = null;
      toast(c.name + ' is now do-not-contact. A goodbye note is ready on their timeline.');

ACTIONS.dnc = function (t) {

function goodbyeDraft(c) {

  if (!tpl) return null;

ACTIONS.sendGoodbye = function (t) {

var BANNED = ['just checking in', 'touching base', 'circling back', 'reaching out', 'i noticed you haven', 'valued customer', 'at this time', 'premier'];
var SUPERLATIVES = ['best', 'greatest', 'top', '#1', 'lowest', 'highest', 'cheapest', 'fastest', 'most', 'biggest', 'finest', 'perfect'];
function sentenceCount(s) { return String(s || '').split(/[.!?]+(?=\s|$)/).filter(function (x) { return x.trim(); }).length; }
function checkCopy(subject, email, text, slot) {
  var w = [];
  var all = [subject, email, text].join('\n');
  var low = all.toLowerCase();
  if (all.indexOf('!') !== -1) w.push('Has an exclamation point.');
  if (all.indexOf('$') !== -1) w.push('Has a dollar sign; no dollar figures in notes.');
  BANNED.forEach(function (b) { if (low.indexOf(b) !== -1) w.push('Banned phrase: "' + b + '".'); });
  SUPERLATIVES.forEach(function (sup) { if (new RegExp('(^|[^a-z#])' + sup.replace('#', '\\#') + '([^a-z]|$)').test(low)) w.push('Superlative: "' + sup + '".'); });
  if (slot === 'GOODBYE') {
    if (all.indexOf('?') !== -1) w.push('Goodbye notes must not ask a question.');
  } else {
    [['Email', email], ['Text', text]].forEach(function (pair) {
      var body = String(pair[1] || '').trim();
      var q = (body.match(/\?/g) || []).length;
      if (q > 1) w.push(pair[0] + ' has ' + q + ' question marks; exactly one.');
      if (q === 0) w.push(pair[0] + ' has no question.');
      if (body && body.slice(-1) !== '?') w.push(pair[0] + ' does not end with the question.');
    });
    if (subject.indexOf('?') !== -1) w.push('Subject has a question mark; the one question belongs in the body.');
  }
  if (sentenceCount(email) > 5) w.push('Email has ' + sentenceCount(email) + ' sentences (5 max).');
  if (sentenceCount(text) > 2) w.push('Text has ' + sentenceCount(text) + ' sentences (2 max).');
  return w;
}
var SEASONS = ['winter', 'spring', 'summer', 'fall', 'any'];
function renderTemplates() {
  var ov = overridesMap();
  var groups = {};
  LIBRARY.templates.forEach(function (t) { (groups[t.slot] = groups[t.slot] || []).push(t); });
  var slots = KIT.SLOTS.filter(function (s) { return groups[s]; }).concat(Object.keys(groups).filter(function (s) { return KIT.SLOTS.indexOf(s) === -1; }));
  var cs = activeCustomers().sort(byName);
  var out = [html`<h2>Templates <span class="muted">${LIBRARY.templates.length} · ${LIBRARY_SOURCE}</span></h2>
  <div class="card thin">
    <label>Preview next 8 touches for</label>
    <select data-on-change="previewCustomer"><option value="">Pick a customer</option>${cs.map(function (c) { return html`<option value="${c.id}" ${ui.previewCustomer === c.id ? 'selected' : ''}>${c.name} · ${c.vehicleLabel}</option>`; })}</select>
    ${renderPreview()}
  </div>`];
  slots.forEach(function (slot) {
    var list = groups[slot];
    var open = ui.tplOpen[slot];
    out.push(html`<h3 data-act="tplToggleSlot" data-slot="${slot}" role="button" style="cursor:pointer">${open ? '▾' : '▸'} ${SLOT_LABEL[slot] || slot} <span class="muted">(${list.length})</span></h3>`);
    if (!open) return;
    var seasons = slot === 'VALUE' ? SEASONS : ['any'];
    seasons.forEach(function (season) {
      var items = list.filter(function (t) { return (t.season || 'any') === season; });
      if (!items.length) return;
      if (slot === 'VALUE') out.push(html`<h4>${season}</h4>`);
      items.forEach(function (t) { out.push(renderTemplateCard(t, ov[t.id])); });
    });
  });
  return raw(out.map(part).join(''));
}

function processOptouts(force) {
  if (store.mode !== 'firebase' || !store.auth || !navigator.onLine) return Promise.resolve();
  if (!force && Date.now() - optoutsCheckedAt < 60000) return Promise.resolve();
  optoutsCheckedAt = Date.now();
  return FS.list('optouts').then(function (rows) {
    var changed = false;
    rows.forEach(function (row) {
      var token = row.id;
      var hit = customersArr().filter(function (c) { return c.unsubscribeToken === token; })[0];
      if (hit && hit.status !== 'dnc') {
        saveCustomer(KIT.applyEvent(hit, { type: 'optOut', reason: 'unsubscribe link', channel: 'email', at: (row.data && row.data.at) || nowIso() }, today()));
        changed = true;
        toast(hit.name + ' unsubscribed by link');
      }
      store.enqueue({ op: 'delete', path: 'optouts/' + token });
    });
    if (changed) render();
  }).catch(function () { /* offline or denied; try again later */ });
}

/* ============================================================ 11. Public unsubscribe page */
function goodbyeTextForUnsub() {
  var fallback = 'Okay, no more notes from me. If you ever want a hand with a vehicle, the number still works.';
  try {
    var lib = builtInLibrary();
    var g = (lib.templates || []).filter(function (t) { return t.slot === 'GOODBYE' && !/\{(?!first)[a-z_]+/.test(t.emailBody); })[0];
    if (!g) return fallback;
    var body = g.emailBody.replace(/\{first\},?\s*/g, '');
    return body.charAt(0).toUpperCase() + body.slice(1);
  } catch (e) { return fallback; }
}
function renderUnsubscribe(token) {
  document.title = 'You are off the list';
  setHtml($('#app'), html`<div class="unsub">
    <p class="muted"><span class="mark" style="display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--mag);color:#fff;font-weight:800;font-size:14px;text-align:center;line-height:22px">M</span> Mick · North Star Car Guy</p>
    <h1>You're off the list.</h1>
    <p>${goodbyeTextForUnsub()}</p>
    <p class="muted small" id="unsubStatus"></p>
  </div>`);
  var cfg = lsGet(LS.fb, null) || metaFirebase();
  if (!cfg || !cfg.apiKey || !cfg.projectId) return;
  var url = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(cfg.projectId) + '/databases/(default)/documents/optouts?documentId=' + encodeURIComponent(token) + '&key=' + encodeURIComponent(cfg.apiKey);
  fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ fields: { at: { stringValue: nowIso() }, source: { stringValue: 'link' } } }) })
    .then(function (r) { if (!r.ok && r.status !== 409) throw new Error('status ' + r.status); })
    .catch(function () { var el = $('#unsubStatus'); if (el) el.textContent = 'If you still get a note after this, reply STOP and it ends there.'; });
}

/* ============================================================ 12. Boot */
function boot() {
  var u = new URLSearchParams(location.search).get('u');
  if (u && /^[A-Za-z0-9_-]{20,64}$/.test(u)) { renderUnsubscribe(u); return; }
  store.init();
  loadLibrary();
  if (ui.tab === 'add') { ui.editId = null; ui.repeatMode = false; }
  ui.replyOpen = null; ui.tplEdit = null; ui.forceCustomer = '';
  render();                                  // first paint from cache, before any network
  window.addEventListener('online', function () { store.setOffline(false); store.flush(); store.load().then(function (ok) { if (ok) render(); }); });
  window.addEventListener('offline', function () { store.setOffline(true); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { store.flush(); processOptouts(); } });
  if (store.mode === 'firebase' && store.auth) {
    store.flush().then(function () { return store.load(); }).then(function (ok) { if (ok) { render(); return processOptouts(true); } });
  }
}
boot();
</script>
