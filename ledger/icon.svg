<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Foresight">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g)"/>
  <!-- ascending bars (safe zone: kept within the central ~80%) -->
  <g fill="#c7d2fe">
    <rect x="140" y="300" width="46" height="72" rx="10"/>
    <rect x="212" y="262" width="46" height="110" rx="10"/>
    <rect x="284" y="224" width="46" height="148" rx="10"/>
  </g>
  <!-- foresight trend line + arrow -->
  <path d="M140 300 L212 262 L284 224 L372 156" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330 150 L378 150 L378 198" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
