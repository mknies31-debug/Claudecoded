# Foresight — standalone deploy config (its own project).
#
# This folder IS the site root. Deploy it directly:
#   • Drag-and-drop: drop this whole folder onto https://app.netlify.com/drop
#   • Or "New site from Git": leave Base directory BLANK (do NOT set it to
#     "ledger" — there is no subfolder here; the files are already at the root).
#
# Netlify serves index.html at the root and bundles the Anthropic proxy from
# netlify/functions/ledger.js. No build step.
#
# Before it works: Site settings → Environment variables → add ANTHROPIC_API_KEY.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
