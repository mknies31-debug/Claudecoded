# Foresight — standalone deploy config (its own project).
#
# Two ways to deploy:
#   • Drag-and-drop (zip/folder): drop this folder onto https://app.netlify.com/drop
#     — the files are at the folder root, leave Base directory blank.
#   • "New site from Git" from the Claudecoded repo: set Base directory = ledger
#     (in that repo this app lives in the ledger/ subfolder).
#
# Netlify serves index.html at the site root and bundles the Anthropic proxy
# from netlify/functions/ledger.js. No build step.
#
# Before it works: Site settings → Environment variables → add ANTHROPIC_API_KEY.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
