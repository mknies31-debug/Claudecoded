# CARVIS — Netlify deploy config.
#
# Drag the carvis/ folder onto Netlify (or point a site at it). Static files are
# served from the folder root; the Anthropic proxy runs as a serverless function.
# There is NO local build step — Netlify bundles the function automatically.
#
# Before it works: Site settings → Environment variables → add ANTHROPIC_API_KEY.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The daily referral cron. Schedule is also declared in the function via
# `export const config`; this block is the explicit, readable source of truth.
[functions."daily-runner"]
  schedule = "0 14 * * *"   # 14:00 UTC ≈ 9:00am Central

# Serve ES modules (shared/*.mjs, crm/crm.js) with a JS content type so the
# browser will import them as modules on every host.
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/shared/*"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
