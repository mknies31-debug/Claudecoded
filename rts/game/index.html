<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RTS Skirmish — Twin Ridge</title>
<style>
  :root{ --bg:#10141b; --panel:#1a2029; --line:#2c3644; --ink:#e7edf5; --dim:#93a1b3;
    --me:#63a6e6; --cpu:#8bbf5a; --wood:#b5772e; --ore:#e0a52a; --gold:#ffd24d; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #top{display:flex;align-items:center;gap:16px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  #top b{font-size:15px} .stat{color:var(--dim)} .stat span{color:var(--ink);font-weight:700}
  .ctl{color:var(--dim);font-size:12px;display:flex;align-items:center;gap:5px}
  .ctl select{background:#222a35;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:12px;cursor:pointer}
  .credit{color:var(--gold);font-weight:800;font-size:15px}
  #wrap{display:flex;height:calc(100vh - 45px)}
  #stage{flex:1;position:relative;background:#0c1017}
  canvas{display:block;width:100%;height:100%;cursor:crosshair}
  #side{width:210px;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow:auto}
  #side h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim)}
  .bbtn{display:flex;justify-content:space-between;width:100%;text-align:left;border:1px solid var(--line);
    background:#222a35;color:var(--ink);border-radius:7px;padding:7px 9px;margin-bottom:6px;cursor:pointer;font-size:12.5px}
  .bbtn:hover:not(:disabled){border-color:var(--me)} .bbtn:disabled{opacity:.4;cursor:not-allowed}
  .bbtn .c{color:var(--gold);font-weight:700}
  .bbtn.locked{opacity:.5}
  #sel{margin-top:12px;color:var(--dim);font-size:12px;min-height:40px}
  #banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(8,11,16,.78);font-size:34px;font-weight:800}
  #banner button{margin-top:16px;font-size:15px;padding:10px 20px;border:0;border-radius:8px;background:var(--me);color:#fff;font-weight:700;cursor:pointer}
  #hint{position:absolute;left:10px;bottom:8px;color:#93a1b3aa;font-size:11.5px;pointer-events:none}
  #q{position:absolute;left:10px;top:8px;color:#cfe0f2;font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="top">
  <b>Twin Ridge</b>
  <span class="stat">Credits <span class="credit" id="cr">0</span></span>
  <span class="stat">Army <span id="army">0</span></span>
  <span class="stat">Ore <span id="ore">locked</span></span>

      <option value="easy">Easy</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard</option>
      <option value="expert">Expert</option>
    </select>
  </label>
  <label class="ctl">Build
    <select id="speed">
      <option value="normal" selected>Normal</option>
      <option value="fast">Fast</option>
      <option value="instant">Instant</option>
    </select>
  </label>
  <span class="stat" style="margin-left:auto;color:var(--cpu)">CPU credits <span id="cpucr">0</span> · army <span id="cpuarmy">0</span></span>
</div>
<div id="wrap">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="q"></div>
    <div id="hint">Left-drag: select · Right-click: move / attack · Right-click a resource with a gatherer: harvest</div>
    <div id="banner"><div id="bantext"></div><button onclick="location.reload()">Play again</button></div>
  </div>
  <div id="side">
    <h3>Build (Directorate)</h3>
    <div id="build"></div>
    <div id="sel">No selection.</div>
  </div>
</div>

const ME='Directorate', CPU='Covenant';
const byName={}; for(const f in ROSTER) for(const u of ROSTER[f]) byName[u.name]={...u,faction:f};

// ---- combat math: identical to combat-core.mjs ----
const pdps = u => u.reload>0 ? (u.dmg*u.proj/u.reload)*(u.acc/100) : 0;
const effHP = (def, atkType, atk) => { if(atk&&atk.ignoreResist) return def.hp;
  const r=(def.resist?.[atkType]??0)/100; return r<1?def.hp/(1-r):Infinity; };

// ---- world ----
const W=MAP.size.w, H=MAP.size.h;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let SCALE=6, OX=0, OY=0;
function resize(){ const r=cv.parentElement.getBoundingClientRect(); cv.width=r.width; cv.height=r.height;
  SCALE=Math.min(cv.width/W, cv.height/H); OX=(cv.width-W*SCALE)/2; OY=(cv.height-H*SCALE)/2; }
addEventListener('resize',resize);
const sx=x=>OX+x*SCALE, sy=y=>OY+y*SCALE;
const wx=px=>(px-OX)/SCALE, wy=py=>(py-OY)/SCALE;

const SPEED = c => ({'Basic infantry':5,'Specialist infantry':4.5,'Scout vehicle':9,'Main battle tank':4.5,
  'Advanced vehicle':5.5,'Artillery':3.5,'Aircraft':11}[c] ?? 5);
const RAD = c => ({'Basic infantry':0.9,'Specialist infantry':1,'Scout vehicle':1.2,'Main battle tank':1.7,
  'Advanced vehicle':1.5,'Artillery':1.5,'Aircraft':1.4,'HQ':4.5}[c] ?? 1.1);
const WOODCR=8, ORECR=11;

let ents=[], credits={me:1200,cpu:1200}, oreUnlocked={me:false,cpu:false}, over=null;
let uid=1;
// difficulty ties the CPU to the ai-policy easy→expert axis: worse comp, slower
// reactions, later attacks, thinner economy at the low end — no stat cheats (§40).
const DIFFS = {
  easy:   { think:8, attackVal:3800, gather:2, ore:false, comp:'naive'  },
  normal: { think:6, attackVal:3000, gather:3, ore:true,  comp:'top'    },
  hard:   { think:5, attackVal:2600, gather:3, ore:true,  comp:'best'   },
  expert: { think:4, attackVal:2100, gather:4, ore:true,  comp:'best'   },
};
let DIFF='normal';
const SPEEDS = { normal:1, fast:0.4, instant:0.02 };  // build-time multiplier
let BUILDMULT=1;
const bt = u => Math.max(0.1,(u.build||20)*BUILDMULT);
function spawn(owner, name, x, y){ const u=byName[name];
  const e={id:uid++, owner, u, name, x, y, hp:u.hp, maxHp:u.hp, cd:Math.random()*u.reload,
    order:'idle', tx:x, ty:y, tgt:null, node:null, cls:u.class}; ents.push(e); return e; }
const HQ_STATS={class:'HQ',hp:6000,resist:{smallArms:40,explosive:10,antiArmor:0,energy:0,air:-15,siege:-30}}; // small-arms shrug off; siege/air bust it (combined arms matters)
function spawnHQ(owner,x,y){ const e={id:uid++,owner,u:HQ_STATS,name:'HQ',x,y,hp:HQ_STATS.hp,maxHp:HQ_STATS.hp,
  order:'hq',cls:'HQ',queue:[],rally:{x:x+(owner==='me'?6:-6),y}}; ents.push(e); return e; }

// resource nodes from the map
let nodes = MAP.resources.map(r=>({type:r.type, x:r.x, y:r.y, owner:r.owner}));
function nearestNode(e,type){ let best=null,bd=1e9; for(const n of nodes){ if(type&&n.type!==type)continue;
  const d=Math.hypot(n.x-e.x,n.y-e.y); if(d<bd){bd=d;best=n;} } return best; }

// high ground bonus
function onHigh(x,y){ return MAP.highGround.some(g=>Math.hypot(g.x-x,g.y-y)<=g.radius); }

// ---- setup: HQ + 2 wood gatherers each ----
const hqMe=spawnHQ('me', MAP.spawns[0].x, MAP.spawns[0].y);
const hqCpu=spawnHQ('cpu', MAP.spawns[1].x, MAP.spawns[1].y);
function startGatherers(owner, hq, woodName){ const wn=nearestNode(hq,'wood');
  for(let i=0;i<2;i++){ const g=spawn(owner, woodName, hq.x+(i-0.5)*2, hq.y+3); g.order='harvest'; g.node=wn; } }
startGatherers('me', hqMe, ROSTER[ME].find(u=>/harvest|lumber/i.test(u.role||u.name))?.name || 'Lumber Harvester');
startGatherers('cpu', hqCpu, ROSTER[CPU].find(u=>/timber|harvest|wood/i.test(u.name))?.name || 'Timber Technical');

// ---- build menu (player) ----
const BUILDABLE = {
  Directorate:['Lumber Harvester','Mining Vehicle','Rifleman Squad','Missile Trooper','Warden AA Halftrack','Vanguard MBT','Lancer Tank Destroyer','Howitzer'],
  Covenant:['Timber Technical','Scrap Hauler','Raider Squad','Rocket Technical','Scorch Buggy','Marauder Scrap Tank','Ambush Tank','Interceptor Gyro'],
};
const buildDiv=document.getElementById('build');
function renderBuild(){ buildDiv.innerHTML='';
  for(const name of BUILDABLE[ME]){ const u=byName[name]; const b=document.createElement('button');
    b.className='bbtn'; const locked=u.tier>=2 && !oreUnlocked.me;
    b.innerHTML=`<span>${name}${locked?' 🔒':''}</span><span class="c">${u.cost}</span>`;
    b.disabled = credits.me<u.cost || locked;
    b.title = locked?'Needs an ore gatherer (tier-2+ tech gate)':`Build ${name} (${u.build||20}s)`;
    b.onclick=()=>queueBuild('me',hqMe,name); buildDiv.appendChild(b); } }
function queueBuild(owner,hq,name){ const u=byName[name]; if(credits[owner]<u.cost) return;
  if(u.tier>=2 && !oreUnlocked[owner]) return;
  credits[owner]-=u.cost; hq.queue.push({name, left:bt(u)}); }

// ---- selection & orders ----
let sel=[], drag=null;
cv.addEventListener('mousedown',e=>{ if(e.button!==0) return; drag={x0:e.offsetX,y0:e.offsetY,x1:e.offsetX,y1:e.offsetY}; });
cv.addEventListener('mousemove',e=>{ over={x:wx(e.offsetX),y:wy(e.offsetY)}; if(drag){drag.x1=e.offsetX;drag.y1=e.offsetY;} });
addEventListener('mouseup',e=>{ if(e.button!==0||!drag) return;
  const a={x0:Math.min(drag.x0,drag.x1),y0:Math.min(drag.y0,drag.y1),x1:Math.max(drag.x0,drag.x1),y1:Math.max(drag.y0,drag.y1)};
  const box=(a.x1-a.x0)>4||(a.y1-a.y0)>4;
  sel = ents.filter(en=>en.owner==='me'&&en.cls!=='HQ'&&(box
      ? sx(en.x)>=a.x0&&sx(en.x)<=a.x1&&sy(en.y)>=a.y0&&sy(en.y)<=a.y1
      : Math.hypot(sx(en.x)-drag.x1,sy(en.y)-drag.y1)<Math.max(10,RAD(en.cls)*SCALE)));
  drag=null; updateSel(); });
cv.addEventListener('contextmenu',e=>{ e.preventDefault(); if(!sel.length) return;
  const t={x:wx(e.offsetX),y:wy(e.offsetY)};
  const enemy=ents.find(en=>en.owner==='cpu'&&Math.hypot(en.x-t.x,en.y-t.y)<Math.max(2,RAD(en.cls)));
  const node=nodes.find(n=>Math.hypot(n.x-t.x,n.y-t.y)<3);
  for(const s of sel){
    if(enemy){ s.order='attack'; s.tgt=enemy; s.tx=enemy.x; s.ty=enemy.y; }
    else if(node && /harvest|lumber|mining|timber|scrap/i.test(s.name)){ s.order='harvest'; s.node=node; }
    else { s.order='move'; s.tx=t.x; s.ty=t.y; s.tgt=null; } }
});
function updateSel(){ const d=document.getElementById('sel');
  if(!sel.length){ d.textContent='No selection.'; return; }
  const by={}; for(const s of sel) by[s.name]=(by[s.name]||0)+1;
  d.innerHTML='<b>'+sel.length+' selected</b><br>'+Object.entries(by).map(([n,c])=>`${c}× ${n}`).join('<br>'); }

// ---- movement + combat ----
const DT=1/30; let acc=0, last=performance.now();
function moveToward(e, tx, ty, sp){ const dx=tx-e.x, dy=ty-e.y, d=Math.hypot(dx,dy);
  if(d<0.05) return 0; const step=Math.min(d, sp*DT); e.x+=dx/d*step; e.y+=dy/d*step; return d-step; }
function separate(e){ for(const o of ents){ if(o===e||o.cls==='HQ') continue;
  const dx=e.x-o.x, dy=e.y-o.y, d=Math.hypot(dx,dy), min=RAD(e.cls)+RAD(o.cls);
  if(d>0&&d<min){ const p=(min-d)*0.5; e.x+=dx/d*p; e.y+=dy/d*p; } } }

function acquire(e){ let best=null,bd=1e9; const rng=(e.u.range||5)+3;
  for(const o of ents){ if(o.owner===e.owner) continue; const d=Math.hypot(o.x-e.x,o.y-e.y);
    if(d<rng+ (o.cls==='HQ'?4:0) && d<bd){bd=d;best=o;} } return best; }

function combat(e){ if(pdps(e.u)<=0) return; // unarmed (gatherers)
  let t=e.tgt;
  if(!t||t.hp<=0||t.owner===e.owner){ t=acquire(e); e.tgt=t; }   // reacquire; DON'T cancel an attack-move if none found
  if(!t){ return; }               // no enemy in reach → updateEnt keeps the attack-move rolling toward tx/ty
  e.tx=t.x; e.ty=t.y;             // track the target as the fallback destination
  const d=Math.hypot(t.x-e.x,t.y-e.y), rng=e.u.range||5;
  if(d>rng){ if(e.cls!=='Artillery'||d>rng+3) moveToward(e,t.x,t.y,SPEED(e.cls)); return; }
  e.cd-=DT; if(e.cd>0) return; e.cd=e.u.reload;
  // damage = fraction of target removed per shot, from the sim's effHP model
  const mult = (onHigh(e.x,e.y)&&!onHigh(t.x,t.y))?1.15:1;
  const dmg = t.maxHp * (pdps(e.u)*e.u.reload/ effHP(t.u,e.u.dmgType,e.u)) * mult;
  applyDamage(t, dmg, e);
  if((e.u.aoe||1)>1){ for(const o of ents){ if(o.owner===e.owner||o===t) continue;
    if(Math.hypot(o.x-t.x,o.y-t.y)<=e.u.aoe){ applyDamage(o, dmg*0.5, e); } } }
  e.fx={x:t.x,y:t.y,life:4,type:e.u.dmgType};
}
function applyDamage(t,dmg,src){ t.hp-=dmg; if(t.hp<=0){ if(t.cls==='HQ') endGame(t.owner==='me'?'cpu':'me');
  ents=ents.filter(x=>x!==t); sel=sel.filter(x=>x!==t); } }

function harvest(e){ if(!e.node){ e.node=nearestNode(e, /mining|scrap/i.test(e.name)?'ore':'wood'); }
  const n=e.node; if(!n) return; const d=Math.hypot(n.x-e.x,n.y-e.y);
  if(d>1.4){ moveToward(e,n.x,n.y,SPEED(e.cls)); }
  else { const rate=(n.type==='ore'?ORECR:WOODCR)*DT; credits[e.owner]+=rate;
    if(n.type==='ore') oreUnlocked[e.owner]=true; } }

function updateEnt(e){
  if(e.cls==='HQ'){ if(e.queue.length){ e.queue[0].left-=DT;
    if(e.queue[0].left<=0){ const b=e.queue.shift(); const g=spawn(e.owner,b.name,e.rally.x+(Math.random()-0.5)*3,e.rally.y+(Math.random()-0.5)*3);
      if(/harvest|lumber|mining|timber|scrap/i.test(b.name)){ g.order='harvest'; g.node=nearestNode(g, /mining|scrap/i.test(b.name)?'ore':'wood'); } } } return; }
  if(e.order==='harvest'){ harvest(e); return; }
  if(pdps(e.u)>0){ combat(e); if(e.tgt){ return; } }
  if(e.order==='move'||e.order==='attack'){ const rem=moveToward(e,e.tx,e.ty,SPEED(e.cls)); if(rem<0.1) e.order='idle'; }
  separate(e);
}

// ---- CPU brain: build counters (ai-policy heuristic) + attack ----
let cpuTimer=0, cpuAttack=false;
function cpuThink(){
  const d = DIFFS[DIFF];
  const myArmy = ents.filter(e=>e.owner==='me'&&pdps(e.u)>0);
  const cpuGath = ents.filter(e=>e.owner==='cpu'&&pdps(e.u)<=0&&e.cls!=='HQ').length;
  const oreComing = oreUnlocked.cpu || hqCpu.queue.some(q=>q.name==='Scrap Hauler')
    || ents.some(e=>e.owner==='cpu'&&/scrap hauler/i.test(e.name));
  // economy: reach the tier's gatherer target, then (if this tier techs) save for
  // the ore gatherer before spending on army — tryCpuBuild only fires when affordable.
  if(cpuGath<d.gather){ tryCpuBuild('Timber Technical'); }
  else if(d.ore && !oreComing){ tryCpuBuild('Scrap Hauler'); }
  else if(d.comp==='naive'){ tryCpuBuild('Raider Squad'); }   // easy: tier-1 spam only
  else {
    // composition: score buildable+unlocked combat units as counters to the player's army
    const enemy = myArmy.length?myArmy:[{u:byName['Rifleman Squad']}];
    const cand = BUILDABLE[CPU].map(n=>byName[n]).filter(u=>pdps(u)>0);
    let best=null,bs=-1; for(const c of cand){ if(c.tier>=2&&!oreUnlocked.cpu) continue;
      let s=0; for(const en of enemy){ const eff=effHP(en.u,c.dmgType,c); s+=pdps(c)/(isFinite(eff)?eff:1e9); }
      s/=Math.max(1,c.cost/400); if(s>bs){bs=s;best=c;} }
    if(best) tryCpuBuild(best.name);
  }
  // attack once the army is worth committing (threshold scales with difficulty)
  const cpuArmy = ents.filter(e=>e.owner==='cpu'&&pdps(e.u)>0);
  const val = cpuArmy.reduce((a,e)=>a+e.u.cost,0);
  if(val>d.attackVal) cpuAttack=true; if(cpuArmy.length<3) cpuAttack=false;
  if(cpuAttack){ for(const e of cpuArmy){ if(e.order==='idle'||!e.tgt){ e.order='attack'; e.tx=hqMe.x; e.ty=hqMe.y; } } }
}
function tryCpuBuild(name){ const u=byName[name]; if(!u||credits.cpu<u.cost) return false;
  if(u.tier>=2&&!oreUnlocked.cpu) return false; credits.cpu-=u.cost; hqCpu.queue.push({name,left:bt(u)}); return true; }

// ---- loop ----
function endGame(winner){ if(over) return; over=winner;
  document.getElementById('banner').style.display='flex';
  document.getElementById('bantext').textContent = winner==='me'?'Victory':'Defeat';
  document.getElementById('bantext').style.color = winner==='me'?'var(--me)':'var(--cpu)'; }

function tick(){ if(over) return;
  for(const e of [...ents]) updateEnt(e);
  cpuTimer-=DT; if(cpuTimer<=0){ cpuThink(); cpuTimer=DIFFS[DIFF].think; }
}
function loop(now){ acc+=Math.min(0.1,(now-last)/1000); last=now;
  while(acc>=DT){ tick(); acc-=DT; }
  render(); requestAnimationFrame(loop); }

// ---- render ----
function render(){ resizeIfNeeded(); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#16241a'; ctx.fillRect(OX,OY,W*SCALE,H*SCALE);
  // high ground
  for(const g of MAP.highGround){ ctx.fillStyle='#2f4a30'; ctx.beginPath(); ctx.arc(sx(g.x),sy(g.y),g.radius*SCALE,0,7); ctx.fill(); }
  // water
  ctx.strokeStyle='#25507a'; ctx.lineWidth=SCALE*3.2; ctx.lineCap='round';
  for(const b of MAP.barriers.filter(b=>b.type==='water')){ ctx.beginPath(); ctx.moveTo(sx(b.from.x),sy(b.from.y)); ctx.lineTo(sx(b.to.x),sy(b.to.y)); ctx.stroke(); }
  // cliffs
  ctx.strokeStyle='#0c0f13'; ctx.lineWidth=SCALE*1.1;
  for(const b of MAP.barriers.filter(b=>b.type==='cliff')){ ctx.beginPath(); ctx.moveTo(sx(b.from.x),sy(b.from.y)); ctx.lineTo(sx(b.to.x),sy(b.to.y)); ctx.stroke(); }
  // nodes
  for(const n of nodes){ ctx.save(); ctx.translate(sx(n.x),sy(n.y)); ctx.rotate(0.78);
    ctx.fillStyle=n.type==='wood'?'#b5772e':'#e0a52a'; ctx.fillRect(-SCALE*1.3,-SCALE*1.3,SCALE*2.6,SCALE*2.6); ctx.restore(); }
  // entities
  for(const e of ents) drawEnt(e);
  // selection markers
  ctx.strokeStyle='#63a6e6'; ctx.lineWidth=1.5;
  for(const s of sel){ ctx.beginPath(); ctx.arc(sx(s.x),sy(s.y),RAD(s.cls)*SCALE+3,0,7); ctx.stroke(); }
  // drag box
  if(drag){ ctx.strokeStyle='#63a6e6'; ctx.setLineDash([4,3]); ctx.strokeRect(drag.x0,drag.y0,drag.x1-drag.x0,drag.y1-drag.y0); ctx.setLineDash([]); }
  // HUD
  document.getElementById('cr').textContent=Math.floor(credits.me);
  document.getElementById('cpucr').textContent=Math.floor(credits.cpu);
  document.getElementById('army').textContent=ents.filter(e=>e.owner==='me'&&pdps(e.u)>0).length;
  document.getElementById('cpuarmy').textContent=ents.filter(e=>e.owner==='cpu'&&pdps(e.u)>0).length;
  document.getElementById('ore').textContent=oreUnlocked.me?'unlocked':'locked';
  renderBuild();
}
let lastW=0,lastH=0;
function resizeIfNeeded(){ if(cv.clientWidth!==lastW||cv.clientHeight!==lastH){ resize(); lastW=cv.clientWidth; lastH=cv.clientHeight; } }
function drawEnt(e){ const col=e.owner==='me'?'#63a6e6':'#8bbf5a'; const r=RAD(e.cls)*SCALE;
  ctx.save(); ctx.translate(sx(e.x),sy(e.y));
  if(e.cls==='HQ'){ ctx.fillStyle=col; ctx.fillRect(-r,-r,r*2,r*2); ctx.strokeStyle='#0009'; ctx.lineWidth=2; ctx.strokeRect(-r,-r,r*2,r*2);
    ctx.fillStyle='#fff'; ctx.font='bold '+(r*0.7)+'px sans-serif'; ctx.textAlign='center'; ctx.fillText('HQ',0,r*0.3); }
  else if(e.cls==='Aircraft'){ ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(0,-r); ctx.lineTo(r,r); ctx.lineTo(-r,r); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#0009'; ctx.stroke(); }
  else { ctx.fillStyle=pdps(e.u)>0?col:'#7d8a97'; ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill(); ctx.strokeStyle='#0009'; ctx.lineWidth=1.2; ctx.stroke(); }
  ctx.restore();
  // hp bar
  if(e.hp<e.maxHp){ const w=r*2.2,x=sx(e.x)-w/2,y=sy(e.y)-r-5; ctx.fillStyle='#0008'; ctx.fillRect(x,y,w,3);
    ctx.fillStyle=e.hp/e.maxHp>0.4?'#5fd06a':'#e0623a'; ctx.fillRect(x,y,w*Math.max(0,e.hp/e.maxHp),3); }
  // muzzle flash
  if(e.fx&&e.fx.life>0){ ctx.strokeStyle={smallArms:'#ddd',antiArmor:'#ff7a45',explosive:'#ffca3a',energy:'#5fd0e0',siege:'#ef5350',air:'#90caf9'}[e.fx.type]||'#ccc';
    ctx.lineWidth=1.5; ctx.globalAlpha=e.fx.life/4; ctx.beginPath(); ctx.moveTo(sx(e.x),sy(e.y)); ctx.lineTo(sx(e.fx.x),sy(e.fx.y)); ctx.stroke(); ctx.globalAlpha=1; e.fx.life--; }
}
document.getElementById('q').textContent = `You: Directorate (blue)   vs   CPU: Covenant (green) — destroy the enemy HQ`;
document.getElementById('diff').onchange = e => DIFF = e.target.value;
document.getElementById('speed').onchange = e => BUILDMULT = SPEEDS[e.target.value];
resize(); requestAnimationFrame(loop);
</script>
