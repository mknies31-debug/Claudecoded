# VOLT — standalone deploy config (separate from CARVIS).
#
# To deploy VOLT as its own site: in Netlify, create a new site from this repo
# and set "Base directory" = volt. Netlify then serves volt/index.html at the
# site root (https://your-volt-site.netlify.app/). No build step, no API key,
# no serverless functions — VOLT is a single self-contained file.

[build]
  publish = "."
